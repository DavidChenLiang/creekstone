<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face{font-family:'IS';src:url('/workspace/creekstone/fonts/InstrumentSerif-Regular.ttf')}
  @font-face{font-family:'DM';src:url('/workspace/creekstone/fonts/DMSans-500.ttf')}
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1240px;background:#fff;font-family:'DM',sans-serif;color:#14161a}
  .web{height:470px;background:#f7f5ef;padding:34px 64px;display:flex;flex-direction:column}
  .nav{display:flex;align-items:center;justify-content:space-between}
  .nav img{width:132px;display:block}
  .nav ul{display:flex;gap:34px;list-style:none;font-size:13px;color:#5c5a52}
  .hero{margin-top:auto;margin-bottom:auto;max-width:720px}
  .hero h1{font-family:'IS';font-weight:400;font-size:64px;line-height:1.08;letter-spacing:-.015em}
  .hero p{font-size:15px;line-height:1.6;color:#6b6960;margin-top:20px;max-width:440px}
  .cards{display:flex;gap:36px;padding:44px 64px 56px;background:#fff;align-items:center}
  .card{width:512px;height:318px;padding:34px;display:flex;flex-direction:column;justify-content:space-between}
  .dark{background:#14161a;color:#f7f5ef}
  .card img{width:158px;display:block}
  .meta{font-size:11px;line-height:1.6;letter-spacing:.01em}
  .dark .meta{color:#8f8d84}
  .meta b{font-weight:500}
</style></head>
<body>
  <div class="web">
    <div class="nav">
      <img src="creekstone-wordmark-ink.svg">
      <ul><li>work</li><li>notes</li><li>about</li><li>contact</li></ul>
    </div>
    <div class="hero">
      <h1>Small things,<br>made properly.</h1>
      <p>creek stone builds the unglamorous parts of software — the small, frequent, awkward jobs that nobody wants to plan a project around.</p>
    </div>
  </div>
  <div class="cards">
    <div class="card dark">
      <img src="creekstone-wordmark-cream.svg">
      <div class="meta"><b>Chen Liang</b><br>creek stone studio<br>hello@creekstone.studio</div>
    </div>
    <div class="card" style="background:#f7f5ef">
      <img src="creekstone-stacked-ink.svg" style="width:118px">
      <div class="meta" style="color:#6b6960"><b>creek stone</b><br>small systems<br>上海 · 远程</div>
    </div>
  </div>
</body></html>
